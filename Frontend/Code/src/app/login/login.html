<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow-lg border-0" style="width: 100%; max-width: 400px; border-radius: 15px;">
    
    <div class="text-center mb-4">
      <div class="mb-3">
        <i class="bi bi-mortarboard-fill h1 text-primary"></i>
      </div>
      <h2 class="fw-bold">Portal Prevest</h2>
      <p class="text-muted">Sistema de Automação Acadêmica</p>
    </div>

    <hr class="text-muted mb-4">

    <div class="d-grid gap-2">
      <p class="text-center small text-secondary mb-2">Acesse com sua conta institucional</p>
      
      <button (click)="loginComGoogle()" class="btn btn-outline-danger w-100 py-3 fw-bold shadow-sm d-flex align-items-center justify-content-center">
        <i class="bi bi-google me-3 fs-5"></i> 
        Entrar com Google
      </button>
    </div>

    <div class="mt-4 text-center">
      <small class="text-muted">
        Ao entrar, você autoriza o acesso ao Google Classroom e Drive para fins de agendamento.
      </small>
    </div>

  </div>
</div>
