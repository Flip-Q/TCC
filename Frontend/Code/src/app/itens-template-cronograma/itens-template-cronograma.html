<div class="container-fluid mt-2">
  
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">
        Itens do Template: <span class="text-primary">{{ templateInfo()?.titulo }}</span>
    </h2>
        
    <button class="btn btn-outline-secondary btn-sm mb-2" (click)="voltar()">
        <i class="bi bi-arrow-left"></i> Voltar
    </button>
  </div>

  <div class="card shadow-sm border-0 mb-4 bg-light">
    <div class="card-body">
      <label class="form-label fw-bold text-secondary">Adicionar Nova Aula</label>
      <div class="input-group">
        <input type="text" class="form-control" placeholder="Ex: Aula 1 - Introdução à Cinemática" 
               [(ngModel)]="novoItemTitulo" (keyup.enter)="adicionarItem()">
               
        <button class="btn btn-success px-4" type="button" (click)="adicionarItem()" [disabled]="!novoItemTitulo.trim()">
          <i class="bi bi-plus-lg me-1"></i> Adicionar
        </button>
      </div>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th class="p-3 text-center" style="width: 60px;">#</th>
            <th class="p-3">Título da Aula</th>
            <th class="p-3 text-center" style="width: 100px;">Ações</th>
          </tr>
        </thead>
        <tbody>
          @for (item of listaItens(); track item.id; let i = $index) {
            <tr>
              <td class="p-3 align-middle text-center text-muted fw-bold">{{ i + 1 }}</td>
              <td class="p-3 align-middle">{{ item.titulo_aula }}</td>
              <td class="p-3 text-center">
                
                <button class="btn btn-danger px-2 py-1" style="font-size: 0.85rem;" (click)="excluirItem(item.id)" title="Excluir Aula">
                  <i class="bi bi-trash"></i>
                </button>
                
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="3" class="p-4 text-center text-muted">
                Nenhuma aula cadastrada neste template ainda. Digite o nome acima e clique em "Adicionar".
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
  
</div>
